<!doctype html>
<!--
    调试页：只渲染 ActionsTable。下面那两个资源的 URL 由 tools/debug/serve.mjs 在返回本页时替换成
    真实文件名（CSS 直接复用生产构建出的那份 —— 类名是同一套，不必重跑 Tailwind）。

    ⚠️ 这段注释里**不要写那两个占位符的字面量**：`String.replace` 只换第一个匹配，而它是从上往下扫的
    —— 注释在 `href` 前面，于是替换全打在注释上、`href` 原样漏出去（实测踩过：页面没样式，
    查了半天以为服务器没重启）。

    `class="dark"` 不能少：全站深色是 index.html 上写死的，少了它量出来的颜色/边框全是浅色主题的。
-->
<html lang="zh-CN" class="dark">
    <head>
        <meta charset="UTF-8" />
        <title>ActionsTable 调试</title>
        <link rel="stylesheet" href="__CSS__" />
    </head>
    <body class="bg-background text-foreground">
        <div id="app"></div>
        <script type="module" src="__JS__"></script>
    </body>
</html>
